<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% if page.title %}{{ page.title }} · {% endif %}Prediction@Illinois</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}Prediction@Illinois">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:image" content="{{ site.url }}/brand/og-image-1200x630.png">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="/brand/favicon-64.png">
<script>(function(){var r=document.documentElement;try{if(!r.dataset.theme){r.dataset.theme=localStorage.getItem("pi-theme")==="light"?"light":"dark"}}catch(e){r.dataset.theme="dark"}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/assets/css/site.css?v={{ site.time | date: '%s' }}">
</head>
<body>
{% include header.html %}
<main id="top">
{{ content }}
{% include footer.html %}
</main>
<script src="/assets/js/site.js?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
