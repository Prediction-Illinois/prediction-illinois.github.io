<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="mark" viewBox="0 0 100 100">
      <g fill="none" stroke="currentColor" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="49" cy="50" r="13"/>
        <path d="M62 37 L62 66 Q62 82.5 55.73 82.5 A33 33 0 1 1 82.5 55.73 L91.5 63.5"/>
      </g>
    </symbol>
  </defs>
</svg>
<header class="site">
  <div class="wrap bar">
    <a class="brandlink" href="/" aria-label="Prediction at Illinois, home">
      <svg style="color:var(--brand)"><use href="#mark"/></svg>
      <span class="wordmark">Prediction<span class="at">@</span>Illinois</span>
    </a>
    <nav class="site" aria-label="Primary">
      <a href="/"{% if page.url == '/' %} class="on"{% endif %}>Home</a>
      <div class="dd">
        <a href="/markets/" class="dd-t{% if page.url contains '/markets/' %} on{% endif %}" aria-haspopup="true" aria-expanded="false">Markets <svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><path d="M2 4.5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></a>
        <div class="dd-m" role="menu">
          <a href="/markets/" role="menuitem"><span class="st all">All</span>All markets</a>
          {% for m in site.data.markets %}<a href="/markets/{{ m[0] }}/" role="menuitem"{% if page.market == m[0] %} class="on"{% endif %}><span class="st">{{ m[1].chip }}</span>{{ m[1].name }}</a>{% endfor %}
        </div>
      </div>
      <a href="/research/"{% if page.url == '/research/' %} class="on"{% endif %}>Research</a>
      <a href="/team/"{% if page.url == '/team/' %} class="on"{% endif %}>Team</a>
    </nav>
    <span class="chip"><i class="dot"></i><span class="t">Fall 2026 ·</span> Applications open</span>
    <button class="theme" id="theme" type="button" aria-label="Toggle light and dark theme" title="Theme"><svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><circle cx="10" cy="10" r="7.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 2.75a7.25 7.25 0 0 0 0 14.5z" fill="currentColor"/></svg></button>
    <a class="btn btn-1" href="/apply/">Apply</a>
  </div>
</header>
