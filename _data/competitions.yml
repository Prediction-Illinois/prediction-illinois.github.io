# Prediction-market and forecasting competitions members have entered or hosted, newest first.
#   name, organizer, url      required
#   role                      competed | hosted   (hosted entries get their own section at the top)
#   start, end                YYYY-MM-DD; the status badge (Upcoming / In progress / Completed) is computed from them
#   members                   names exactly as on the Team page (they link to LinkedIn)
#   entry                     optional team or submission name
#   format                    one or two sentences on what entrants do
#   result                    optional, only once the organizer publishes it (e.g. "Top 10 of 870") — no P&L
- name: Explaining Markets — Q4 2026
  organizer: University of Chicago Booth · Optiver
  url: https://explainingmarkets.ai
  role: competed
  start: 2026-10-12
  end: 2026-12-15
  members: [Yicheng Yang]
  entry: Prediction@Illinois
