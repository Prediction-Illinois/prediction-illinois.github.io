# Prediction-market and forecasting competitions: ones members have entered or hosted, and public ones open now.
#   name, organizer, url      required
#   role                      competed | hosted | open
#                               competed/hosted: club entries (hosted get their own section at the top)
#                               open: public competitions anyone can enter, shown under "Open now";
#                                     each one drops off the site after its end date
#   markets                   market keys (elections | sports | crypto | economics | tech | weather);
#                             the entry also appears on those market pages
#   start, end                YYYY-MM-DD; club entries need both (the status badge is computed from them);
#                             open entries may leave out start, and leave out end if they run on a rolling basis
#   members                   optional; names exactly as on the Team page (they link to LinkedIn)
#   entry                     optional team or submission name
#   format                    one or two sentences on what entrants do (open entries: keep it to one)
#   prize                     open entries only, optional: the organizer's published prize, shown as written, e.g. "$10,000 prize pool"
#   result                    optional, only once the organizer publishes it (e.g. "Top 10 of 870") — no P&L
- name: Explaining Markets — Q4 2026
  organizer: University of Chicago Booth · Optiver
  url: https://explainingmarkets.ai
  role: competed
  markets: [economics]
  start: 2026-10-12
  end: 2026-12-15
  entry: Prediction@Illinois
  format: AI systems that explain how stocks react to earnings announcements. As each company reports, the agent receives the earnings-call summary, submits a prediction automatically, and is scored against the actual market reaction on a public leaderboard.

- name: Susquehanna Predictions Cup — Midterm Elections Tournament
  organizer: Susquehanna International Group
  url: https://sig.thesuper.market/
  role: competed
  markets: [elections]
  start: 2026-10-01
  end: 2026-11-04
  format: A student trading competition on the 2026 U.S. midterm elections. Entrants trade Senate, House and governor contracts on SIG's prediction-market platform with simulated currency, and standings are final once every market settles on the real results.

