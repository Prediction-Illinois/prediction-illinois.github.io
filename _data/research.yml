- title: "Pricing Prediction Markets: Incomplete Markets, Selection Rules, and Calibration Wedges"
  authors:
    - name: Yicheng Yang
      affiliation: University of Illinois Urbana-Champaign
      linkedin: https://www.linkedin.com/in/ethan85/
  year: 2026
  status: Working paper
  kind: paper            # paper | tool  (tool → green badge)
  badge: RBFC 2026 · Working paper
  badge_url: https://www.rbfc.eu/      # badge links here; title and abstract link to the paper
  summary: Estimates the price–probability calibration wedge on 291,309 resolved contracts across six platforms with a one-parameter Wang-transform tilt, and shows the wedge cannot be explained as compensation for aggregate risk.
  venue: SSRN
  presented: Research in Behavioral Finance Conference (RBFC) 2026, VU Amsterdam, September 2026
  pages: 61
  written: March 2026
  revised: September 2026
  tags: [Pricing, Calibration, Polymarket, Kalshi, Manifold]
  links:
    ssrn: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=6468338
  abstract: >
    Prediction market prices are widely read as event probabilities—pure expectations with no risk premium. Whether a wedge between price and probability reflects compensation for risk or a distortion of beliefs cannot be settled in ordinary markets, where the physical probability is unobserved and every test joins a pricing model to a belief model. Event contracts loosen that constraint: each resolved contract records a 0/1 outcome, so repeated resolutions estimate the price–outcome calibration relationship among listed, resolved contracts even though no single contract's latent probability is observed. Summarizing that relationship by a scalar λ requires a maintained parameterization; I use the Wang transform, which arises exactly when the market-selected pricing measure is a one-parameter exponential tilt of a latent Gaussian threshold factor, p(mkt) = Φ(Φ⁻¹(p*) + λ), with favorite-longshot bias as a corollary. The data are 291,309 resolved contracts from eight source samples on six platforms. In the three exchange samples (N = 287,118), the fitted λ is positive on Polymarket (0.166) and Kalshi (0.187) and negative on Manifold (−0.218), the one play-money exchange; the three no-money forecasting tournaments are positive (0.287, 0.570, 0.635). The Manifold-versus-real-money contrast is descriptive: capital status varies with venue design, contract mix, aggregation, and participant composition, and the contrast does not identify a stakes channel. In the baseline Polymarket sample the wedge falls with volume (−0.072 per log unit, SE 0.005), rises with duration (+0.143 per log unit, SE 0.012), and declines over contract life. Contract returns are essentially uncorrelated with the S&P 500; under the maintained mapping, attributing the wedge to aggregate-risk compensation would require a portfolio beta near 139, more than forty times the upper confidence bound of the estimated beta. The data do not distinguish the remaining mechanisms—local risk-bearing, beliefs, market design, or omitted factors—but they do show that the tested linear S&P covariance channel is quantitatively too small to reproduce the fitted wedge.

- title: "Zeus: A Settlement-Aware Engine for Daily-Temperature Prediction Markets"
  authors:
    - name: Yuxuan Song
      affiliation: University of Illinois Urbana-Champaign
      linkedin: https://www.linkedin.com/in/fitz-song/
  year: 2026
  status: Research system
  kind: tool             # green badge
  badge: Research system · Code      # badge and title both link to the repo
  markets: [weather]
  summary: Prices Polymarket's daily-temperature markets from ECMWF-anchored multi-model forecasts, integrating over each contract's exact settlement rule — station, observation clock, rounding and bin topology — and grades every decision-time probability against verified settlement in a published calibration report.
  links:
    code: https://github.com/fitz-s/zeus      # source-available (all rights reserved), not open source
  abstract: >
    Each daily-temperature contract turns a city's weather, a settlement station, an observation
    convention, and an integer rounding rule into a family of mutually exclusive claims. A forecast can
    be meteorologically accurate and still lose because it prices the wrong station, the wrong preimage
    of a rounded bin, or a book that cannot fill at the assumed cost. The engine therefore treats
    understanding as a chain of proof. It records what evidence existed before the decision, turns the
    forecast into one probability distribution over the complete settlement space, maps each executable
    route to its actual payoff, and commits only when the lower tail of that decision remains useful after
    depth, fees, and existing exposure. Settlement judges the exact belief the system committed to — not a
    more favorable story reconstructed afterwards.

- title: "Oracle3: Fee-Aware No-Arbitrage Checks Across Kalshi and Polymarket"
  authors:
    - name: Yicheng Yang
      affiliation: University of Illinois Urbana-Champaign
      linkedin: https://www.linkedin.com/in/ethan85/
  year: 2026
  status: Open-source software
  kind: tool             # green badge
  badge: Open source · v1.2.1
  badge_url: https://github.com/YichengYang-Ethan/oracle3-prediction-market-agent/releases/tag/v1.2.1
  summary: Maps the logical relations between event contracts on Kalshi and Polymarket, finds the cheapest basket at executable prices whenever quotes break the axioms of probability, prices every leg under that venue's own fee schedule, and paper-trades the baskets that survive under pre-trade risk limits.
  links:
    code: https://github.com/YichengYang-Ethan/oracle3-prediction-market-agent   # Apache-2.0; original U Lab portions MIT (NOTICE)
  abstract: >
    Contracts on related outcomes are tied together by probability. If A implies B, then P(A) ≤ P(B);
    if A and B cannot both happen, P(A) + P(B) ≤ 1; the outcomes of one event sum to one. Quoted prices
    break these bounds, within a venue and across venues, and a basket that pays a known amount in every
    state can then be bought for less than that amount. The gaps are small, and both venues charge taker
    fees that scale with p(1 − p), so whether a gap is worth anything depends on the fee on every leg.
    Oracle3 records which markets are related and how — implication, exclusivity, complement, the same
    event across venues, event sums — finds the cheapest basket for each relation, reports the edge
    before and after fees, and paper-trades the survivors under position, drawdown and exposure limits
    with a kill switch. It installs from PyPI and runs as an MCP server, so AI agents can call the same
    checks. It is research software with no live track record. Oracle3 began at U Lab (UIUC) with
    Haofei Yu and bundles the lab's open-source Coinjure package.

- title: "FOMC Decision Relative Value: Calendar-Matched Futures and Prediction Markets"
  authors:
    - name: Yicheng Yang
      affiliation: University of Illinois Urbana-Champaign
      linkedin: https://www.linkedin.com/in/ethan85/
  year: 2026
  status: Research brief
  kind: tool             # green badge: open research code
  badge: Research brief · Code v0.2.0
  badge_url: https://github.com/YichengYang-Ethan/fed-basis-backtest/releases/tag/v0.2.0
  markets: [economics]
  summary: Tests whether Fed Funds futures calendar spreads and Polymarket and Kalshi decision contracts value the same FOMC decision differently enough to trade once contract matching, executable prices, EFFR drift, integer hedges and funding are accounted for, with open data pipelines, a depth-cost replay and an offline verification suite.
  links:
    code: https://github.com/YichengYang-Ethan/fed-basis-backtest
  abstract: >
    Can different markets assign sufficiently different values to the same Federal Reserve decision
    to support a useful relative-value trade? This project studies that question through contract-level
    payoff matching, timestamp-aware market data, transaction costs and the cash required to carry the
    position. The economic link is a ZQ calendar spread, whose sensitivity to a FOMC decision is
    determined by the delivery calendar. Prediction-market digitals supply a different payoff shape.
    The research asks whether a matched package remains attractive after executable prices, omitted
    states, EFFR drift, integer hedge quantities and funding are accounted for. The current
    hold-to-settlement model is a baseline for further research. The next questions concern exit timing,
    contract and route selection, state coverage, execution and incremental portfolio capital.
